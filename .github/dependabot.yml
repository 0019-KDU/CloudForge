# Dependabot version updates. Security updates are enabled separately in the repository settings.
# Every update arrives as a pull request and goes through the full CI (ci-required) like any change.
# The cooldown delays brand-new releases a few days, which avoids most compromised-release incidents.

version: 2
updates:
  # Pinned action SHAs in .github/workflows (Dependabot updates the SHA and the version comment).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"

  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 5
    open-pull-requests-limit: 5
    # Major upgrades are planned migrations (code changes, review), not automatic PRs.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      backend-minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: "build(backend)"

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 5
    open-pull-requests-limit: 5
    # Major upgrades are planned migrations (code changes, review), not automatic PRs.
    # @types/node must follow the Node version the project runs (22), not the latest Node.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      frontend-minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: "build(frontend)"

  # Base images in the Dockerfiles (tags and digests).
  - package-ecosystem: docker
    directories: [/backend, /frontend]
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    commit-message:
      prefix: "build(docker)"
