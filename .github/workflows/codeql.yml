# CodeQL static analysis (SAST) for the Java backend and the TypeScript frontend.
# Results go to the repository's Security → Code scanning page and appear on pull requests.
#
# Advisory at first: findings do not fail this workflow. Blocking is done by GitHub's code scanning
# merge protection (a repository ruleset), enabled after the baseline is triaged.
# See docs/ci-cd/CI-ARCHITECTURE.md#codeql.

name: CodeQL

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1" # Mondays 03:17 UTC: picks up new queries even without code changes
  workflow_dispatch:

permissions: {}

concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write # upload results to code scanning
    strategy:
      fail-fast: false
      matrix:
        include:
          # Build mode "none": CodeQL extracts Java and TypeScript from source, so no Maven or npm
          # build (and no project code) runs in this job.
          - language: java-kotlin
            build-mode: none
          - language: javascript-typescript
            build-mode: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # Default queries plus additional security queries (more findings, still low noise).
          queries: security-extended

      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ matrix.language }}
