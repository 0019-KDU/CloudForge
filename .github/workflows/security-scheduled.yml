# Weekly deep security checks that are too slow or too broad for every pull request.
# Independent from PR validation: a finding here never blocks a merge, it opens/updates alerts and
# fails this run so the owners are notified. See docs/ci-cd/CI-ARCHITECTURE.md#scheduled-security.

name: Scheduled security

on:
  schedule:
    - cron: "43 4 * * 1" # Mondays 04:43 UTC
  workflow_dispatch:

permissions: {}

concurrency:
  group: scheduled-security
  cancel-in-progress: false

env:
  GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
  TRIVY_IMAGE: ghcr.io/aquasecurity/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c
  ZIZMOR_IMAGE: ghcr.io/zizmorcore/zizmor:1.32.0@sha256:3014cc8f68f663935f69b3c3e0e41f5ce102b268d97db13db0f62208747f860d

jobs:
  # Every commit ever pushed, not just recent ones: catches secrets that slipped in before the PR
  # gate existed or through history rewrites.
  secrets-full-history:
    name: Secret scan, full history (Gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan all commits
        run: |
          expected=$(git rev-list --count --all)
          echo "Scanning full history ($expected commits)"
          # safe.directory: see the same step in ci.yml (prevents a silent pass on a refused repo).
          set +e
          docker run --rm -v "$GITHUB_WORKSPACE:/repo:ro" \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/repo \
            "$GITLEAKS_IMAGE" git /repo --config /repo/.gitleaks.toml --log-opts="--all" \
            --redact --no-banner --no-color --verbose 2>&1 | tee "$RUNNER_TEMP/gitleaks.log"
          status=${PIPESTATUS[0]}
          set -e
          if [[ "$status" -ne 0 ]]; then
            echo "::error title=Secret detected in history::Rotate the secret; removing it from history alone is not enough"
            exit "$status"
          fi
          scanned=$(grep -oE '[0-9]+ commits scanned' "$RUNNER_TEMP/gitleaks.log" | grep -oE '^[0-9]+' || echo 0)
          if (( expected > 0 && scanned == 0 )); then
            echo "::error title=Secret scan did not run::Gitleaks scanned 0 of $expected commits"
            exit 1
          fi

  # All severities, including unfixed ones, uploaded to code scanning for tracking. The PR gate only
  # blocks on fixable HIGH/CRITICAL; this run gives the complete picture.
  dependencies-full:
    name: Full vulnerability scan (Trivy)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write # upload SARIF to code scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Maven resolves into the local repository; Trivy reads it offline (see the trivy job in ci.yml).
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Resolve Maven dependencies
        working-directory: backend
        run: ./mvnw --batch-mode --no-transfer-progress dependency:resolve

      - name: Scan (all severities, SARIF)
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/repo" -v "$HOME/.m2/repository:/root/.m2/repository:ro" \
            -w /repo "$TRIVY_IMAGE" \
            fs --scanners vuln,misconfig --offline-scan --ignorefile .trivyignore.yaml --no-progress \
            --format sarif --output trivy-results.sarif .

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: trivy-results.sarif
          category: trivy-weekly

      - name: Fail on fixable HIGH/CRITICAL (same policy as the PR gate)
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/repo:ro" -v "$HOME/.m2/repository:/root/.m2/repository:ro" \
            -w /repo "$TRIVY_IMAGE" \
            fs --scanners vuln,misconfig --severity HIGH,CRITICAL --ignore-unfixed --offline-scan \
            --ignorefile .trivyignore.yaml --exit-code 1 --no-progress --format table .

  # zizmor with online audits (known-vulnerable actions, impostor commits, ref confusion). Needs a
  # read-only token to query the GitHub API; the PR job runs offline instead.
  workflows-online:
    name: Workflow security, online audits (zizmor)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          docker run --rm -e GH_TOKEN -v "$GITHUB_WORKSPACE:/repo:ro" -w /repo "$ZIZMOR_IMAGE" \
            --format=github .github/workflows
