# CloudForge deployment to an ECS environment. Architecture: docs/ci-cd/CD-ARCHITECTURE.md
#
#   - staging:    called by CI after every successful push to main (pushes the images CI tested)
#   - production: run manually ("Run workflow") with the commit SHA staging is running; the
#                 "production" GitHub environment requires an approval before AWS credentials exist
#   - rollback:   run manually with an earlier commit SHA, for either environment
#
# AWS access is OIDC only: the job exchanges a GitHub token for short-lived credentials of the
# environment's deploy role, which trusts only this repository's jobs in that GitHub environment.

name: Deploy

on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      image_tag:
        type: string
        required: true
      push_images:
        description: Push the images from this run's artifacts to ECR first.
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      environment:
        description: Environment
        type: choice
        options: [staging, production]
        required: true
      image_tag:
        description: Full commit SHA to deploy (its images must already be in ECR)
        type: string
        required: true

permissions: {}

jobs:
  deploy:
    name: Deploy to ${{ inputs.environment }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    # One deployment per environment at a time; a newer one waits instead of interrupting.
    concurrency:
      group: deploy-${{ inputs.environment }}
      cancel-in-progress: false
    environment:
      name: ${{ inputs.environment }}
      url: ${{ vars.APP_URL }}
    permissions:
      contents: read
      id-token: write # OIDC token for AWS
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download tested images
        if: inputs.push_images
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "*-image-${{ inputs.image_tag }}"
          path: ${{ runner.temp }}/images

      - name: AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'ap-south-1' }}
          # Refuse to deploy if the role somehow resolves into a different account.
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          role-session-name: github-deploy-${{ github.run_id }}
          role-duration-seconds: 3600

      - name: Deploy
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          IMAGE_TAG: ${{ inputs.image_tag }}
          ARTIFACT_DIR: ${{ inputs.push_images && format('{0}/images', runner.temp) || '' }}
        run: .github/scripts/ecs-deploy.sh "$ENVIRONMENT" "$IMAGE_TAG" "$ARTIFACT_DIR"

      # End to end through CloudFront: the SPA is served, and /api reaches a backend that enforces
      # authentication (401 without a token).
      - name: Verify the public URL
        if: vars.APP_URL != ''
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            page=$(curl -s -o /dev/null -w '%{http_code}' "$APP_URL/")
            api=$(curl -s -o /dev/null -w '%{http_code}' "$APP_URL/api/users/me")
            echo "attempt $attempt: / → $page, /api/users/me → $api"
            if [[ "$page" == 200 && "$api" == 401 ]]; then
              echo "| public URL | $APP_URL | ✅ page 200, API 401 without token |" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 10
          done
          echo "::error title=Public URL check failed::$APP_URL did not answer as expected (page 200, API 401)."
          exit 1
