# Included in every location: NGINX drops inherited add_header directives as soon as a location
# defines its own, so the headers live in one file instead of being repeated.
#
# CSP: scripts only from this origin (no inline, no eval). Inline styles are allowed because Radix
# positioning and the toast library set them at runtime. connect-src 'self' matches the same-origin
# /api design. HSTS is left to the TLS-terminating load balancer.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
