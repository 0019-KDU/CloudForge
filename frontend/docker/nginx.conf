# Main NGINX config for the CloudForge SPA image (runs as the unprivileged nginx user, uid 101).
# Every path NGINX writes to is under /tmp (pid, temp files, the rendered server config), so the
# container runs with a read-only root filesystem plus a writable /tmp.

worker_processes auto;
pid /tmp/nginx.pid;

error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    # The JSON log line carries the correlation ID the SPA sends, so a browser error can be matched
    # to backend logs. "path" is the URL as requested (list filters included); cookies and headers
    # with credentials are never logged.
    log_format json escape=json '{"time":"$time_iso8601","remote":"$remote_addr","method":"$request_method",'
                                '"path":"$request_uri","status":$status,"bytes":$body_bytes_sent,'
                                '"duration":$request_time,"correlation_id":"$http_x_correlation_id",'
                                '"user_agent":"$http_user_agent"}';
    access_log /dev/stdout json;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml font/woff2;

    # The server block is rendered from /etc/nginx/templates into /tmp at start-up (see Dockerfile),
    # so /tmp is the only writable path the container needs. The image's stock conf.d is not used.
    include /tmp/nginx/*.conf;
}
